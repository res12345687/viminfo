<!doctype html><html><head><link rel="stylesheet" href="common.css"><style>
html,body{width:1128px;height:191px;overflow:hidden}
.bg{position:absolute;inset:0;background:linear-gradient(100deg,#0b1f3a 0%,#0e2546 55%,#12294f 75%,#0f6f6a 100%)}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.09) 1.2px,transparent 1.4px);background-size:18px 18px}
.arc{position:absolute;border-radius:50%;border:2px solid rgba(22,184,166,.35)}
.a1{width:420px;height:420px;right:-120px;top:-210px}.a2{width:300px;height:300px;right:-60px;top:-150px;border-color:rgba(22,184,166,.22)}
.a3{width:560px;height:560px;right:-200px;top:-280px;border-color:rgba(255,255,255,.07)}
.glow{position:absolute;width:520px;height:520px;right:-180px;top:-200px;background:radial-gradient(circle,rgba(22,184,166,.35),transparent 65%)}
.wrap{position:absolute;left:300px;right:40px;top:0;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:28px}
.word{color:#fff}
.name{font-family:"Inter Display";font-weight:800;font-size:40px;letter-spacing:-.02em;line-height:1}
.name span{background:linear-gradient(90deg,#3fe0cc,#16b8a6);-webkit-background-clip:text;color:transparent}
.sub{margin-top:6px;font-size:11px;font-weight:600;letter-spacing:.36em;color:#9fb3c8}
.tag{margin-top:14px;font-size:17px;color:#d7e3ef;font-weight:500}
.tag b{color:#3fe0cc;font-weight:600}
.pills{display:flex;flex-direction:column;gap:9px}
.pill{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:7px 16px 7px 8px;color:#fff;font-size:14px;font-weight:600;white-space:nowrap}
.pill i{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#16b8a6,#0f9184);display:grid;place-items:center;font-style:normal;font-size:12px}
.pill small{color:#9fb3c8;font-weight:500;font-size:12.5px}
</style></head><body><div class="bg"></div><div class="dots"></div><div class="glow"></div><div class="arc a3"></div><div class="arc a1"></div><div class="arc a2"></div>

  <div class="pill"><i>✓</i>Digital transformation <small>· consulting</small></div>
 </div>
</div></body></html>
